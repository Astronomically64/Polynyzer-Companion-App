<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polynyzer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#185FA5">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
  <div class="app-container">

    <!-- SCREEN 0: TITLE (MATCHING IMAGE.PNG EXACTLY) -->
    <section id="screen-0" class="screen active">
      <main class="screen-content splash-content">
        <div class="logo-badge">
          <svg class="splash-logo-cluster" viewBox="0 0 64 64" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <!-- Top Triangle -->
            <polygon points="32 10 40 24 24 24" />
            <!-- Bottom-Left Square -->
            <rect x="20" y="32" width="11" height="11" rx="1" />
            <!-- Bottom-Right Circle -->
            <circle cx="39" cy="37.5" r="5.5" />
          </svg>
        </div>

        <h1 class="splash-title">Polynyzer.</h1>
        <p class="splash-description">Your hands-on geometry companion for measuring polygon angles and checking your work.</p>
      </main>

      <footer class="screen-footer">
        <button type="button" id="btn-get-started" class="btn btn-primary">Get started</button>
      </footer>
    </section>

    <!-- SCREEN 1: SHAPE SELECTION -->
    <section id="screen-1" class="screen hidden">
      <header class="app-header">
        <div class="header-nav">
          <button type="button" id="btn-back-screen1" class="btn-icon-back" aria-label="Go back to title screen">
            <svg class="icon-back" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>
        <h1 class="app-title">Polynyzer</h1>
        <p class="app-subtitle">Select the shape you built</p>
      </header>

      <main class="screen-content">
        <div class="shape-grid" role="radiogroup" aria-label="Polygon Shapes">
          <button type="button" class="shape-card" data-sides="3" data-name="Triangle" role="radio" aria-checked="false">
            <svg class="shape-icon" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 3 21 20 3 20" />
            </svg>
            <span class="shape-label">Triangle</span>
          </button>

          <button type="button" class="shape-card" data-sides="4" data-name="Quadrilateral" role="radio" aria-checked="false">
            <svg class="shape-icon" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="1" />
            </svg>
            <span class="shape-label">Quadrilateral</span>
          </button>

          <button type="button" class="shape-card" data-sides="5" data-name="Pentagon" role="radio" aria-checked="false">
            <svg class="shape-icon" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 3 21 9.5 17.5 20 6.5 20 3 9.5" />
            </svg>
            <span class="shape-label">Pentagon</span>
          </button>

          <button type="button" class="shape-card" data-sides="6" data-name="Hexagon" role="radio" aria-checked="false">
            <svg class="shape-icon" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5" />
            </svg>
            <span class="shape-label">Hexagon</span>
          </button>

          <button type="button" class="shape-card" data-sides="7" data-name="Heptagon" role="radio" aria-checked="false">
            <svg class="shape-icon" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 3 19.8 6.8 21.6 15.3 15.6 21 8.4 21 2.4 15.3 4.2 6.8" />
            </svg>
            <span class="shape-label">Heptagon</span>
          </button>

          <button type="button" class="shape-card" data-sides="8" data-name="Octagon" role="radio" aria-checked="false">
            <svg class="shape-icon" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="8 3 16 3 21 8 21 16 16 21 8 21 3 16 3 8" />
            </svg>
            <span class="shape-label">Octagon</span>
          </button>

          <button type="button" class="shape-card custom-card" data-sides="custom" data-name="Custom" role="radio" aria-checked="false">
            <svg class="shape-icon" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5" cy="12" r="1.5" fill="#185FA5" />
              <circle cx="12" cy="12" r="1.5" fill="#185FA5" />
              <circle cx="19" cy="12" r="1.5" fill="#185FA5" />
            </svg>
            <span class="shape-label">Custom</span>
          </button>
        </div>

        <div id="custom-sides-wrapper" class="custom-sides-wrapper hidden">
          <label for="custom-sides-input" class="field-label">Number of sides</label>
          <input type="number" id="custom-sides-input" min="3" max="50" placeholder="e.g. 9" class="app-input">
        </div>

        <div id="screen1-error" class="inline-error hidden">Select a shape first</div>
      </main>

      <footer class="screen-footer">
        <button type="button" id="btn-continue" class="btn btn-primary">Continue</button>
      </footer>
    </section>

    <!-- SCREEN 2: MEASUREMENT INPUT -->
    <section id="screen-2" class="screen hidden">
      <header class="app-header">
        <div class="header-nav">
          <button type="button" id="btn-back-screen2" class="btn-icon-back" aria-label="Go back to shape selection">
            <svg class="icon-back" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>
        <h1 class="app-title">Enter measurements</h1>
        <p id="screen2-subtitle" class="app-subtitle">Shape — 0 angles</p>
      </header>

      <main class="screen-content screen2-layout">
        <div class="diagram-section">
          <div class="diagram-card">
            <div id="live-diagram-container" class="diagram-container"></div>
            <div id="live-shape-badge" class="shape-kind-badge hidden">Convex</div>
            <div id="live-triangulation" class="triangulation-panel hidden">
              <div id="live-triangulation-label" class="triangulation-label">Convex fan</div>
              <div id="live-triangulation-list" class="triangle-chip-list"></div>
              <div id="live-triangulation-note" class="triangulation-note"></div>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div id="angle-inputs-container" class="angle-inputs-list"></div>
        </div>
      </main>

      <footer class="screen-footer">
        <button type="button" id="btn-check-result" class="btn btn-primary">Check result</button>
      </footer>
    </section>

    <!-- SCREEN 3: RESULT -->
    <section id="screen-3" class="screen hidden">
      <header class="app-header">
        <div class="header-nav">
          <button type="button" id="btn-back-screen3" class="btn-icon-back" aria-label="Go back to angle measurements">
            <svg class="icon-back" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>
        <h1 class="app-title">Result</h1>
        <p id="screen3-subtitle" class="app-subtitle">Shape — verified</p>
      </header>

      <main class="screen-content screen3-layout">
        <div class="diagram-section">
          <div class="diagram-card">
            <div id="result-diagram-container" class="diagram-container"></div>
            <div id="result-shape-badge" class="shape-kind-badge">Convex</div>
          </div>
        </div>

        <div class="result-section">
          <div id="result-card" class="result-card">
            <div class="result-card-header">
              <svg id="result-icon" class="result-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></svg>
              <span id="result-status-text">Outcome</span>
            </div>
            <div id="result-sum-text" class="result-card-subtext">Sum: 0° / 0°</div>
            <div id="result-breakdown-text" class="result-card-subtext facet-note"></div>
          </div>
        </div>
      </main>

      <footer class="screen-footer">
        <button type="button" id="btn-try-another" class="btn btn-secondary">Try another shape</button>
      </footer>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
